name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.2, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npx --yes npm@12.0.2 ci
      - run: npx playwright install --with-deps chromium
      - run: npx --yes npm@12.0.2 run verify:release

  ci-status:
    name: CI Status
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the verification matrix passed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "Verification matrix result: $VERIFY_RESULT"
            exit 1
          fi
