name: SignalK Plugin CI

# Calls the official SignalK reusable plugin-ci workflow. The plugin registry
# (https://signalk.org/signalk-plugin-registry/, scored from
# SignalK/signalk-plugin-registry) looks for a workflow run that references
# SignalK/signalk-server/.github/workflows/plugin-ci.yml on the published
# version's commit; without one it applies a scoring penalty. The tag trigger
# guarantees a run exists on the exact commit each release is published from.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@faab2be886fa7d52f926e7d2acf91c910623d4d7 # master
    with:
      build-command: npm run build
      test-command: npm test
      # Pinned rather than inherited: the reusable workflow's defaults can move,
      # and this matrix is the one engines.node advertises.
      node-versions: '["22", "24"]'
      # format-check-command stays unset: ci.yml already enforces formatting on
      # Linux, and setting it here would report a CRLF false positive on Windows.
