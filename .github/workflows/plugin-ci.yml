name: SignalK Plugin CI

# Calls the official SignalK reusable plugin-ci workflow. The plugin registry
# (https://signalk.org/signalk-plugin-registry/, scored from
# SignalK/signalk-plugin-registry) looks for a workflow run that references
# SignalK/signalk-server/.github/workflows/plugin-ci.yml on the published
# version's commit; without one it applies a scoring penalty. A release tags a
# commit on main, so the push run on main is the one the registry credits, and
# the weekly schedule below keeps a run in the window the registry reads.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The registry reads only the newest 20 Actions runs for the release commit,
  # so scheduled and Dependabot runs on main HEAD can push the release's run
  # out of view. A weekly run keeps a fresh one there. It sits after the Monday
  # Workflow Security and Dependabot runs and the Thursday CodeQL default setup
  # scan (about 07:50 UTC, configured in repository settings, not a file here).
  schedule:
    - cron: '17 10 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@3e9924c741c8c2ac5685a5424229b0191b790e5e # master
    with:
      build-command: npm run build
      test-command: npm test
      # Pinned rather than inherited: the reusable workflow's defaults can move,
      # and this matrix is the one engines.node advertises.
      node-versions: '["22", "24"]'
      # format-check-command stays unset: ci.yml already enforces formatting on
      # Linux, and setting it here would report a CRLF false positive on Windows.
