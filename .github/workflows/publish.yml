name: Publish to npm

# A published GitHub release builds and verifies the exact tagged source, packs
# one immutable tarball, and then publishes that artifact with provenance.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the release tag matches the package.json version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag ($TAG_NAME) does not match expected tag ($EXPECTED_TAG)" >&2
            exit 1
          fi
      - name: Verify the release commit is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npx --yes npm@12.0.2 ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx --yes npm@12.0.2 run verify:release
      - name: Pack the verified plugin
        run: npx --yes npm@12.0.2 run pack:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: >-
          npx --yes npm@12.0.2 publish ./artifacts/*.tgz
          --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry source commit
        run: |
          EXPECTED_GIT_HEAD="$(git rev-parse HEAD)"
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 24); do
            ACTUAL_GIT_HEAD="$(npm view "signalk-nmea2000-emitter-cannon@${VERSION}" gitHead --json 2>/dev/null | tr -d '"' || true)"
            if [ "$ACTUAL_GIT_HEAD" = "$EXPECTED_GIT_HEAD" ]; then
              exit 0
            fi
            echo "Waiting for registry metadata (attempt ${attempt}/24)." >&2
            sleep 10
          done
          echo "Published gitHead ($ACTUAL_GIT_HEAD) does not match release commit ($EXPECTED_GIT_HEAD)." >&2
          exit 1
